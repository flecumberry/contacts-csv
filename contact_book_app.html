<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Contact Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* Custom scrollbar and table styles for spreadsheet feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .table-container {
            max-height: calc(100vh - 180px);
        }
        th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 10;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background-color: white;
            z-index: 11;
            box-shadow: 1px 0 2px 0 rgb(0 0 0 / 0.05);
        }
        th:first-child {
            z-index: 12;
            background-color: #f8fafc;
        }
        .sort-icon {
            display: inline-block;
            width: 12px;
            margin-left: 4px;
            color: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4 shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Contact Book</h1>
            <p class="text-sm text-gray-500" id="recordCount">0 records</p>
        </div>
        
        <div class="flex flex-wrap gap-2 items-center">
            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleImport(event)">
            
            <button onclick="document.getElementById('csvFileInput').click()" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                Import CSV
            </button>
            <button onclick="handleExport()" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                Export CSV
            </button>
            
            <div class="h-6 w-px bg-gray-300 mx-2"></div>
            
            <button onclick="openModal()" class="px-4 py-2 bg-blue-600 border border-transparent rounded-md text-sm font-medium text-white hover:bg-blue-700 transition">
                Add New
            </button>
            <button id="btnEdit" onclick="handleEditSelected()" disabled class="px-4 py-2 bg-amber-500 border border-transparent rounded-md text-sm font-medium text-white hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed transition">
                Edit Selected
            </button>
            <button id="btnMerge" onclick="handleMerge()" disabled class="px-4 py-2 bg-purple-600 border border-transparent rounded-md text-sm font-medium text-white hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
                Merge Selected
            </button>
            <button id="btnDelete" onclick="handleDelete()" disabled class="px-4 py-2 bg-red-600 border border-transparent rounded-md text-sm font-medium text-white hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
                Delete
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-6">
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm w-full h-full flex flex-col">
            <div class="overflow-x-auto overflow-y-auto table-container flex-1">
                <table class="w-full text-left border-collapse whitespace-nowrap text-sm">
                    <thead>
                        <tr id="tableHeader" class="border-b border-gray-200">
                            <!-- Headers injected via JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="contactModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-800" id="modalTitle">Edit Contact</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <form id="contactForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Form fields injected via JS -->
                </form>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-lg">
                <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">Cancel</button>
                <button onclick="saveContact()" class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">Save</button>
            </div>
        </div>
    </div>

    <script>
        const FIELDS = [
            "First Name", "Last Name", "Display Name", "Nickname", 
            "Primary Email", "Secondary Email", "Screen Name", 
            "Work Phone", "Home Phone", "Fax Number", "Pager Number", "Mobile Number", 
            "Home Address", "Home Address 2", "Home City", "Home State", "Home ZipCode", "Home Country", 
            "Work Address", "Work Address 2", "Work City", "Work State", "Work ZipCode", "Work Country", 
            "Job Title", "Department", "Organization", 
            "Web Page 1", "Web Page 2", 
            "Birth Year", "Birth Month", "Birth Day", 
            "Custom 1", "Custom 2", "Custom 3", "Custom 4", "Notes"
        ];

        let contacts = [];
        let selectedIds = new Set();
        let sortConfig = { key: null, direction: 'asc' };
        let editingId = null;

        // Generate a unique ID for each contact
        const generateId = () => Math.random().toString(36).substr(2, 9);

        function init() {
            buildTableHeader();
            buildModalForm();
            renderTable();
        }

        function buildTableHeader() {
            const headerRow = document.getElementById('tableHeader');
            headerRow.innerHTML = `
                <th class="p-3 w-12 text-center">
                    <input type="checkbox" id="selectAll" class="rounded border-gray-300" onchange="toggleSelectAll(event)">
                </th>
            `;
            
            FIELDS.forEach(field => {
                const th = document.createElement('th');
                th.className = "p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100 select-none";
                th.onclick = () => handleSort(field);
                
                let sortIndicator = '';
                if (sortConfig.key === field) {
                    sortIndicator = sortConfig.direction === 'asc' ? '↑' : '↓';
                }
                
                th.innerHTML = `${field} <span class="sort-icon">${sortIndicator}</span>`;
                headerRow.appendChild(th);
            });
        }

        function buildModalForm() {
            const form = document.getElementById('contactForm');
            FIELDS.forEach(field => {
                const id = field.replace(/\s+/g, '');
                
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col gap-1";
                
                let inputHtml = '';
                if (field === 'Notes') {
                    inputHtml = `<textarea id="input_${id}" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-24" data-field="${field}"></textarea>`;
                    wrapper.className = "flex flex-col gap-1 md:col-span-2 lg:col-span-3";
                } else {
                    inputHtml = `<input type="text" id="input_${id}" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" data-field="${field}">`;
                }

                wrapper.innerHTML = `
                    <label for="input_${id}" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">${field}</label>
                    ${inputHtml}
                `;
                form.appendChild(wrapper);
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            document.getElementById('recordCount').innerText = `${contacts.length} record${contacts.length !== 1 ? 's' : ''}`;
            
            // Update "Select All" checkbox state
            const selectAllCheck = document.getElementById('selectAll');
            if(selectAllCheck) {
                 selectAllCheck.checked = contacts.length > 0 && selectedIds.size === contacts.length;
                 selectAllCheck.indeterminate = selectedIds.size > 0 && selectedIds.size < contacts.length;
            }

            contacts.forEach(contact => {
                const tr = document.createElement('tr');
                tr.className = selectedIds.has(contact._id) ? "bg-blue-50 hover:bg-blue-100" : "hover:bg-gray-50";
                
                // Checkbox cell
                const tdCheck = document.createElement('td');
                tdCheck.className = "p-3 text-center border-b border-gray-100";
                tdCheck.innerHTML = `<input type="checkbox" class="rounded border-gray-300" ${selectedIds.has(contact._id) ? 'checked' : ''} onchange="toggleSelect('${contact._id}')">`;
                tr.appendChild(tdCheck);

                // Data cells
                FIELDS.forEach(field => {
                    const td = document.createElement('td');
                    td.className = "p-3 border-b border-gray-100 max-w-xs truncate";
                    td.title = contact[field] || '';
                    td.innerText = contact[field] || '';
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            updateActionButtons();
        }

        function handleSort(field) {
            if (sortConfig.key === field) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = field;
                sortConfig.direction = 'asc';
            }

            contacts.sort((a, b) => {
                let valA = (a[field] || '').toString().toLowerCase();
                let valB = (b[field] || '').toString().toLowerCase();
                
                if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            buildTableHeader();
            renderTable();
        }

        function toggleSelect(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            renderTable();
        }

        function toggleSelectAll(e) {
            if (e.target.checked) {
                contacts.forEach(c => selectedIds.add(c._id));
            } else {
                selectedIds.clear();
            }
            renderTable();
        }

        function updateActionButtons() {
            const btnEdit = document.getElementById('btnEdit');
            const btnMerge = document.getElementById('btnMerge');
            const btnDelete = document.getElementById('btnDelete');

            btnEdit.disabled = selectedIds.size !== 1;
            btnMerge.disabled = selectedIds.size < 2;
            btnDelete.disabled = selectedIds.size === 0;
        }

        function handleDelete() {
            if(confirm(`Are you sure you want to delete ${selectedIds.size} contact(s)?`)) {
                contacts = contacts.filter(c => !selectedIds.has(c._id));
                selectedIds.clear();
                renderTable();
            }
        }

        function openModal(id = null) {
            editingId = id;
            document.getElementById('modalTitle').innerText = id ? 'Edit Contact' : 'Add New Contact';
            
            const contact = id ? contacts.find(c => c._id === id) : {};
            
            FIELDS.forEach(field => {
                const inputId = `input_${field.replace(/\s+/g, '')}`;
                const input = document.getElementById(inputId);
                if (input) {
                    input.value = contact[field] || '';
                }
            });

            document.getElementById('contactModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('contactModal').classList.add('hidden');
            editingId = null;
        }

        function handleEditSelected() {
            if (selectedIds.size === 1) {
                const id = Array.from(selectedIds)[0];
                openModal(id);
            }
        }

        function saveContact() {
            const contactData = {};
            FIELDS.forEach(field => {
                const inputId = `input_${field.replace(/\s+/g, '')}`;
                const input = document.getElementById(inputId);
                if (input) {
                    contactData[field] = input.value.trim();
                }
            });

            if (editingId) {
                const index = contacts.findIndex(c => c._id === editingId);
                if (index > -1) {
                    contacts[index] = { ...contactData, _id: editingId };
                }
            } else {
                contactData._id = generateId();
                contacts.push(contactData);
            }

            closeModal();
            renderTable();
        }

        function handleMerge() {
            if (selectedIds.size < 2) return;

            const selectedContacts = contacts.filter(c => selectedIds.has(c._id));
            let mergedContact = { _id: generateId() };
            let hasConflicts = false;

            FIELDS.forEach(field => {
                let uniqueValues = new Set();
                let firstNonEmptyValue = '';

                selectedContacts.forEach(contact => {
                    const val = (contact[field] || '').trim();
                    if (val !== '') {
                        uniqueValues.add(val);
                        if (!firstNonEmptyValue) firstNonEmptyValue = val;
                    }
                });

                if (uniqueValues.size > 1) {
                    hasConflicts = true;
                }
                
                mergedContact[field] = firstNonEmptyValue;
            });

            if (hasConflicts) {
                alert("Conflicts detected during merge. The app has kept the first non-empty value found for conflicting fields.");
            }

            // Remove old contacts and add the new merged one
            contacts = contacts.filter(c => !selectedIds.has(c._id));
            contacts.push(mergedContact);
            
            selectedIds.clear();
            
            // Sort appropriately if active sort
            if(sortConfig.key) {
               handleSort(sortConfig.key); // this will re-trigger the sort algorithm but reverse it, so call it twice or handle differently.
               // Fix to just sort without flipping:
               sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
               handleSort(sortConfig.key);
            } else {
               renderTable();
            }
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        const newContacts = results.data.map(row => {
                            const c = { _id: generateId() };
                            // Map existing fields, ignoring unknown columns
                            FIELDS.forEach(field => {
                                c[field] = row[field] || '';
                            });
                            return c;
                        });
                        contacts = [...contacts, ...newContacts];
                        renderTable();
                    }
                    event.target.value = ''; // Reset input
                }
            });
        }

        function handleExport() {
            if (contacts.length === 0) {
                alert("No contacts to export.");
                return;
            }

            // Exclude internal _id field from export
            const exportData = contacts.map(c => {
                let cleanData = {};
                FIELDS.forEach(f => cleanData[f] = c[f]);
                return cleanData;
            });

            const csv = Papa.unparse({
                fields: FIELDS,
                data: exportData
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'contacts_export.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize application on load
        window.onload = init;
    </script>
</body>
</html>
